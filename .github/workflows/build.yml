name: Build

# Builds the Theos package (.deb) on a GitHub-hosted Apple-silicon macOS
# runner, mirroring the macOS cross-compile path in misc/build.sh:
#
#   gmake FINALPACKAGE=1 STRIP=0 OPTFLAG=-O2 \
#         THEOS_PACKAGE_SCHEME=rootless GO_EASY_ON_ME=1 package
#
# The device-side steps (dpkg -i, set_macos_version.py, ldid re-signing,
# trustcache, rootfs sync) are intentionally NOT performed here: they require
# a jailbroken iPad. This workflow only produces the installable artifact.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Theos package (arm64 macOS)
    runs-on: macos-14
    timeout-minutes: 120

    env:
      THEOS: ${{ github.workspace }}/theos
      # The project targets the rootless iOS 16.5 Theos SDK. That SDK ships
      # without usr/include/xpc/ (see vendor/ios-xpc/README.md); Xcode 15+
      # SDKs do ship it, which makes the hand-written xpc_data_create
      # declaration in MTLCompilerBypassOSCheck/Tweak.x conflict.
      IOS_SDK_VERSION: "16.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install make ldid dpkg xz
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          gmake --version | head -1
          dpkg-deb --version | head -1

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/bin"
          # Theos resolves LDID/DPKG_DEB from $THEOS/bin first.
          ln -sf "$(brew --prefix)/bin/ldid" "$THEOS/bin/ldid"
          ln -sf "$(brew --prefix)/bin/dpkg-deb" "$THEOS/bin/dpkg-deb"

      - name: Install iOS ${{ env.IOS_SDK_VERSION }} SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set "iPhoneOS${IOS_SDK_VERSION}.sdk"
          mkdir -p "$THEOS/sdks"
          cp -R "/tmp/theos-sdks/iPhoneOS${IOS_SDK_VERSION}.sdk" "$THEOS/sdks/"
          ls "$THEOS/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"

      - name: Provide SDKs to Theos
        run: |
          # Theos's TARGET "latest" SDK selector scans both $THEOS/sdks and the
          # Xcode SDK dir, and the TARGET field takes precedence over the
          # SDKVERSION variable (makefiles/targets/_common/darwin_head.mk). Hide
          # the Xcode iPhoneOS SDK so the vendored iOS 16.5 SDK is the newest
          # one Theos can see.
          XCODE_DEV="$(xcode-select -p)"
          for d in "$XCODE_DEV"/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk; do
            if [ -e "$d" ]; then sudo mv "$d" /tmp/; echo "hid $d"; fi
          done
          MAC_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          MAC_VER="$(xcrun --sdk macosx --show-sdk-version)"
          ln -sfn "$MAC_SDK" "$THEOS/sdks/MacOSX${MAC_VER}.sdk"
          ls -l "$THEOS/sdks"

      - name: Build and package
        run: |
          gmake FINALPACKAGE=1 STRIP=0 OPTFLAG=-O2 \
            THEOS_PACKAGE_SCHEME=rootless GO_EASY_ON_ME=1 \
            package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: macpad-deb
          path: packages/*.deb
          if-no-files-found: error
